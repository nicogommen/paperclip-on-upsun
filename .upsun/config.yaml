# Upsun config for paperclip-on-upsun.
# Phase 1 boot is green (route 200). Full rationale + history: ../JOURNAL.md, ../REFERENCE.md.

applications:
  paperclip:
    # The app IS the pinned Paperclip submodule (v2026.529.0), rooted here so build/start use
    # its native paths. NEVER edit upstream/; our additions are generated into the tree at build.
    source:
      root: upstream

    # Node 24 LTS (Paperclip's own Dockerfile base). Node 26 breaks tsx's loader — see JOURNAL.
    type: "nodejs:24"

    # pnpm pinned to Paperclip's declared packageManager, installed the Upsun-native way.
    dependencies:
      nodejs:
        pnpm: "9.15.4"

    # No root package.json, so skip Upsun's default npm install; we drive it with pnpm.
    build:
      flavor: none

    hooks:
      build: |
        set -eu
        pnpm install --frozen-lockfile
        pnpm run build
        # Resolve hook: redirect workspace src/*.ts -> compiled dist/*.js so the server runs as
        # plain node (no runtime tsx; its async loader deadlocks on Upsun Node 24). See JOURNAL.
        cat > .upsun-dist-resolve.mjs <<'HOOK'
        import { registerHooks } from "node:module";
        import { existsSync } from "node:fs";
        import { fileURLToPath } from "node:url";
        registerHooks({
          resolve(specifier, context, nextResolve) {
            const r = nextResolve(specifier, context);
            try {
              if (r?.url?.startsWith("file:") && r.url.includes("/src/") && r.url.endsWith(".ts")) {
                const distUrl = r.url.replace("/src/", "/dist/").replace(/\.ts$/, ".js");
                if (existsSync(fileURLToPath(distUrl))) return { ...r, url: distUrl, format: "module" };
              }
            } catch {}
            return r;
          },
        });
        HOOK
        # .environment: generated here (app root is the un-editable submodule), sourced at runtime
        # when relationship/route vars exist. DATABASE_URL scheme is hardcoded postgresql, NOT
        # $POSTGRESQL_SCHEME (= pgsql, which Paperclip rejects). PUBLIC_URL derived per-env from
        # the primary route. See JOURNAL for the why.
        cat > .environment <<'ENV'
        export DATABASE_URL="postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_PATH}"
        export PAPERCLIP_PUBLIC_URL="$(echo "$PLATFORM_ROUTES" | base64 -d | jq -r 'to_entries | map(select(.value.primary == true and .value.type == "upstream")) | .[0].key')"
        ENV

    # Plain node on the compiled dist (no tsx — see resolve hook above). DATABASE_URL and
    # PAPERCLIP_PUBLIC_URL come from the generated .environment, sourced before this runs.
    web:
      commands:
        start: "node --import ./.upsun-dist-resolve.mjs server/dist/index.js"
      locations:
        "/":
          passthru: true

    # Persistent state across redeploys. Mount keys are relative to the app root, so this lives
    # at /app/paperclip-home at runtime — PAPERCLIP_HOME must match it or the app's mkdir ENOENTs.
    mounts:
      "/paperclip-home":
        source: "storage"
        source_path: "paperclip-home"

    relationships:
      postgresql: "postgresql:postgresql"

    variables:
      env:
        SERVE_UI: "true"
        PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
        PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
        PAPERCLIP_HOME: "/app/paperclip-home"
        HOST: "0.0.0.0"  # bind all interfaces; Upsun's router reaches the container over the network
        PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
        PAPERCLIP_MIGRATION_PROMPT: "never"
        # PAPERCLIP_PUBLIC_URL is derived per-env in .environment (see build hook), not set here.
      # Sensitive vars set out-of-band (upsun variable:create --sensitive --prefix env:):
      #   BETTER_AUTH_SECRET, PAPERCLIP_SECRETS_MASTER_KEY.
      # Agent API keys (ANTHROPIC/OPENAI) belong on the Phase 2 task, not here (PLAN §5.1).

services:
  postgresql:
    type: "postgresql:18"

routes:
  "https://{default}/":
    type: upstream
    upstream: "paperclip:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
