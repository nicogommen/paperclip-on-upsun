# Upsun config for paperclip-on-upsun.
# paperclip: unmodified Paperclip (submodule) + our Upsun task plugin. Each agent run starts the
# `runner` task, which runs Paperclip's own Runner. runner-relay connects Paperclip to the runner,
# since a task accepts no inbound connections. postgresql: Paperclip's database.
# Rationale and history: ../JOURNAL.md, ../PLAN.md.

applications:
  paperclip:
    # Runner route: the app is rooted at paperclip/, which holds the pinned Paperclip submodule
    # (paperclip/upstream, v2026.1117.0, NEVER edited) and our Upsun task plugin (paperclip/plugin).
    source:
      root: paperclip

    # Node 26, the only supported Node on Upsun (24 is deprecated). Upstream requires >= 24.11
    # and only tests 24 in CI. Runtime has no tsx since the bundled entry, so June's Node 26
    # loader breakage no longer applies. Fall back to 24 if the build or boot breaks.
    type: "nodejs:26"

    # BALANCED, not the nodejs default HIGH_CPU: v2026.1117.0 runs out of heap at 224 MB.
    # 0.5 CPU gives 1088 MB here.
    container_profile: BALANCED

    # pnpm pinned to Paperclip's declared packageManager, installed the Upsun-native way.
    dependencies:
      nodejs:
        pnpm: "9.15.4"

    # No root package.json, so skip Upsun's default npm install; we drive it with pnpm.
    build:
      flavor: none

    # Build mirrors upstream's Dockerfile build stage. Needs >= 4 GB build memory (tsc + cargo).
    hooks:
      build: |
        set -eu
        APP=$PWD
        # Pinned upstream commit (= the submodule pin). The provider pack records it.
        UPSTREAM_COMMIT=c0f132898d2a2677312d8c72096187b27a3d9a38
        # .environment at the app root, sourced at runtime. DATABASE_URL scheme is hardcoded
        # postgresql, NOT $POSTGRESQL_SCHEME (= pgsql, which Paperclip rejects). PUBLIC_URL derived
        # per-env from the primary route. NODE_ENV only here: as a build var pnpm would skip devDeps.
        cat > .environment <<'ENV'
        export NODE_ENV=production
        export DATABASE_URL="postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_PATH}"
        export PAPERCLIP_PUBLIC_URL="$(echo "$PLATFORM_ROUTES" | base64 -d | jq -r 'to_entries | map(select(.value.primary == true and .value.type == "upstream")) | .[0].key')"
        ENV
        cd upstream
        # Rust toolchain: the server build always builds the paperclip-runner native binary
        # (cargo), with no skip switch. Pinned rustup like upstream's Dockerfile; the compiler
        # version comes from the runner's rust-toolchain.toml. Toolchain + cargo target cached.
        export RUSTUP_HOME="$PLATFORM_CACHE_DIR/rustup" CARGO_HOME="$PLATFORM_CACHE_DIR/cargo"
        export PATH="$CARGO_HOME/bin:$PATH"
        if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
          curl -fsSLo /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init"
          echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
        fi
        (cd packages/paperclip-runner && rustup show)
        mkdir -p "$PLATFORM_CACHE_DIR/runner-target"
        ln -sfn "$PLATFORM_CACHE_DIR/runner-target" packages/paperclip-runner/runner/target
        # A pnpm store in the build cache doubles disk use and hits ENOSPC. Clear any leftover.
        rm -rf "$PLATFORM_CACHE_DIR/pnpm-store"
        df -h /app /tmp "$PLATFORM_CACHE_DIR" | sed 's/^/disk: /'
        # Same two-step install as upstream (the release lockfile can lag the manifests).
        pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
        pnpm install --frozen-lockfile
        export NODE_OPTIONS=--max-old-space-size=4096
        pnpm --filter @paperclipai/ui build
        pnpm --filter @paperclipai/plugin-sdk build
        # Emit-only tsc: upstream measures > 10 GiB without it, ~2.5 GiB with it.
        PAPERCLIP_TSC_EMIT_ONLY=1 pnpm --filter @paperclipai/server build
        pnpm --filter @paperclipai/server build:runtime
        test -f server/dist-runtime/index.mjs
        # Provider pack for the runner task (runnerd + node + ACPX/Claude tooling), built the way
        # upstream's Dockerfile builds its remote pack. Served to the task from /_upsun-runner/.
        # Built in /tmp (the pack builder renames from /tmp, a different device from /app), then
        # only the archive, its receipt, the manifest and the runner binary are copied into the app.
        mkdir -p "$APP/runner-pack"
        PAPERCLIP_RUNNER_SOURCE_REVISION=$UPSTREAM_COMMIT node packages/paperclip-runner/scripts/build-provider-pack.mjs /tmp/provider-pack
        # The full pack is ~1 GB compressed (every provider). Keep what Claude through ACPX needs:
        # drop the candidate-provider assets and the other providers' native CLIs.
        du -sh /tmp/provider-pack
        (cd /tmp/provider-pack && du -s provider-assets/* node_modules/.pnpm/* 2>/dev/null | sort -rn | head -25 | sed 's/^/pack size: /')
        rm -rf /tmp/provider-pack/provider-assets
        for pkg in /tmp/provider-pack/node_modules/.pnpm/@openai+codex* /tmp/provider-pack/node_modules/.pnpm/opencode-* /tmp/provider-pack/node_modules/.pnpm/@github+copilot* /tmp/provider-pack/node_modules/.pnpm/@cursor* ; do
          [ -e "$pkg" ] && echo "pack prune: $(basename "$pkg")" && rm -rf "$pkg"
        done
        # The Claude SDK native binary (~236 MB) is installed in the runner task image instead
        # (runner-task/package.json pins the same version), so each run downloads far less.
        ls -d /tmp/provider-pack/node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-linux-x64@* | sed 's/^/pack offload: /'
        test -d /tmp/provider-pack/node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-linux-x64@0.3.286
        rm -rf /tmp/provider-pack/node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-linux-x64@0.3.286
        du -sh /tmp/provider-pack
        # Single tar+zstd archive with one SHA-256 (the script's CLI writes a layered format).
        node -e 'import("./scripts/create-provider-pack-archive.mjs").then(m => m.createProviderPackArchive("/tmp/provider-pack")).then(r => console.log("pack archive", JSON.stringify(r)))'
        # runnerd is not inside the pack: ship the binary the runner build staged.
        test -x packages/paperclip-runner/dist/bin/paperclip-runnerd
        cp /tmp/provider-pack.tar.zst /tmp/provider-pack.archive.json /tmp/provider-pack/provider-pack.json packages/paperclip-runner/dist/bin/paperclip-runnerd "$APP/runner-pack/"
        rm -rf /tmp/provider-pack /tmp/provider-pack.tar.zst
        rm packages/paperclip-runner/runner/target
        # Our plugin resolves packages exactly like the server: its node_modules is the server's
        # (which has @paperclipai/plugin-sdk, @paperclipai/paperclip-runner, zod, ws, ...).
        ln -sfn ../upstream/server/node_modules "$APP/plugin/node_modules"
        # Paperclip's packages import @paperclipai/shared as TypeScript source, so the plugin is
        # bundled the way upstream bundles its server (bundleRuntime: @paperclipai/* inlined,
        # third-party deps external by absolute path). dist/worker = process entry,
        # dist/hooks = the same hooks, imported once here to fail the build if the plugin is broken.
        (cd "$APP/plugin" && node -e '
          import("../upstream/server/scripts/bundle-runtime.mjs").then(async m => {
            await m.bundleRuntime({ entry: process.cwd() + "/worker.js", outdir: process.cwd() + "/dist/worker" });
            await m.bundleRuntime({ entry: process.cwd() + "/plugin.js", outdir: process.cwd() + "/dist/hooks" });
            const manifest = (await import("./manifest.js")).default;
            const hooks = (await import("./dist/hooks/server.mjs")).default;
            console.log("plugin ok:", manifest.id, Object.keys(hooks.definition).length, "hooks");
          })')
      # Settings for the plugin worker, which gets no PLATFORM_* variables: written on the
      # mount at each deploy (600), read by paperclip/plugin/worker.js.
      deploy: |
        set -eu
        RELAY_PUBLIC=$(echo "$PLATFORM_ROUTES" | base64 -d | jq -r 'to_entries | map(select(.value.type == "upstream" and (.value.upstream | startswith("runner-relay")))) | .[0].key' | sed 's#^https://#wss://#; s#/$##')
        RELAY_INTERNAL=$(echo "$PLATFORM_RELATIONSHIPS" | base64 -d | jq -r '.relay[0] | "http://\(.host):\(.port)"')
        umask 077
        jq -n --arg p "$PLATFORM_PROJECT" --arg e "$PLATFORM_BRANCH" --arg pub "$RELAY_PUBLIC" --arg int "$RELAY_INTERNAL" \
          --arg s "${RUNNER_RELAY_ADMIN_SECRET:-}" \
          '{projectId: $p, environment: $e, taskName: "runner", relayPublicWss: $pub, relayInternalUrl: $int, relayAdminSecret: $s}' \
          > paperclip-home/upsun-runner.json
        jq '{projectId, environment, taskName, relayPublicWss, relayInternalUrl, adminSecretSet: (.relayAdminSecret != "")}' paperclip-home/upsun-runner.json

    # Upstream's bundled runtime entry (same CMD as its Dockerfile), run from the submodule.
    # DATABASE_URL and PAPERCLIP_PUBLIC_URL come from the generated .environment.
    web:
      commands:
        start: "cd upstream && exec node server/dist-runtime/index.mjs"
      locations:
        # Request buffering off: the UI's live-updates WebSocket (/api/companies/<id>/events/ws)
        # needs it, together with cache off on the route (Upsun "WebSocket routes" doc).
        "/":
          passthru: true
          request_buffering:
            enabled: false
        # Provider pack for the runner task (fetched over the internal relationship). Public code
        # from the pinned open-source release, no secrets.
        "/_upsun-runner":
          root: "runner-pack"
          passthru: false
          allow: false
          rules:
            '(\.zst|\.json|/paperclip-runnerd)$':
              allow: true

    # Persistent state across redeploys. Mount keys are relative to the app root, so this lives
    # at /app/paperclip-home at runtime — PAPERCLIP_HOME must match it or the app's mkdir ENOENTs.
    mounts:
      "/paperclip-home":
        source: "storage"
        source_path: "paperclip-home"

    relationships:
      postgresql: "postgresql:postgresql"
      relay: "runner-relay:http"  # plugin parks task secrets and reads Launcher status here

    # Lets the plugin get a scoped token from the local auth proxy (localhost:8200) to start
    # and watch runner tasks, with no user token.
    authorizations:
      - type: task
        resource: runner
        action: operate
      - type: env
        action: view

    variables:
      env:
        SERVE_UI: "true"
        PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
        PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
        PAPERCLIP_HOME: "/app/paperclip-home"
        HOST: "0.0.0.0"  # bind all interfaces; Upsun's router reaches the container over the network
        PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
        PAPERCLIP_MIGRATION_PROMPT: "never"
        # PAPERCLIP_PUBLIC_URL is derived per-env in .environment (see build hook), not set here.
      # Sensitive vars set out-of-band (upsun variable:create --sensitive --prefix env:):
      #   BETTER_AUTH_SECRET, PAPERCLIP_SECRETS_MASTER_KEY.
      # Agent API keys (ANTHROPIC/OPENAI) belong on the Phase 2 task, not here (PLAN §5.1).

  # WebSocket tunnel so Paperclip can reach a runner inside a task
  # (tasks accept no inbound connections). See relay/server.mjs.
  runner-relay:
    source:
      root: /relay
    type: "nodejs:26"
    web:
      commands:
        start: "node server.mjs"
      # WebSockets need request buffering off (Upsun "WebSocket routes" doc).
      locations:
        "/":
          passthru: true
          request_buffering:
            enabled: false

tasks:
  # Runner route: one Paperclip Runner turn per task run. Started by the Upsun task plugin
  # (paperclip/plugin). The Launcher claims its secrets from the relay, fetches the provider pack
  # from the app, opens the tunnel and starts paperclip-runnerd.
  runner:
    source:
      root: /runner-task
    type: "nodejs:26"
    # Claude Code + runnerd need memory more than CPU: BALANCED gives 1088 MB at 0.5 CPU.
    container_profile: BALANCED
    hooks:
      build: |
        set -eu
        npm install --omit=dev --no-audit --no-fund
    relationships:
      relay: "runner-relay:http"
      pcapp: "paperclip:http"
    run:
      command: "node launcher.mjs"
      timeout: 900
    mounts:
      "/tmp":
        source: "tmp"

services:
  postgresql:
    type: "postgresql:18"

routes:
  "https://{default}/":
    type: upstream
    upstream: "paperclip:http"
    primary: true
    # Required for the UI's live-updates WebSocket. Without it the router turns the upgrade into
    # a plain GET (404), the UI retries every few seconds, and long requests on the same browser
    # connection (the agent test) get re-sent, each re-send starting a new runner task.
    cache:
      enabled: false
  # Paperclip dials wss://relay.{default}/t/<tunnel>/... and the
  # task dials out to the same host. Core requires wss, which the route provides.
  "https://relay.{default}/":
    type: upstream
    upstream: "runner-relay:http"
    cache:
      enabled: false  # required for WebSockets
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
