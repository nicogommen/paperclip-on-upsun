# Upsun config for paperclip-on-upsun.
#
# STATUS: Phase 1 boot is GREEN — the Paperclip server is live on Upsun, route returns 200,
# all boot gates (DATABASE_URL, PAPERCLIP_HOME mount, BETTER_AUTH_SECRET, auth base-url) pass.
# DATABASE_URL and PAPERCLIP_PUBLIC_URL are now assembled in a build-generated `.environment`
# file (Upsun best practice) instead of inline in the start command / a hardcoded var.
# Remaining: Phase 1c functional verification (first-admin claim + persistence), the
# upsun-agent task (Phase 2), the external adapter (Phase 3). See ../JOURNAL.md handoff note.
#
# Companion docs: ../PLAN.md (plan), ../JOURNAL.md (progress), ../REFERENCE.md (facts).

applications:
  paperclip:
    # The app IS the Paperclip submodule. `source.root` roots this app in upstream/
    # (Upsun multi-app submodule pattern), so build/start use Paperclip's own native
    # paths — no `upstream/` prefixes, no `-C`. The submodule is pinned to release
    # v2026.529.0 and NEVER edited; our only build-time addition is the resolve hook
    # generated below, written into the app tree (not committed into the submodule).
    source:
      root: upstream

    # Node 24 LTS, matching Paperclip's own Dockerfile (`FROM node:lts-trixie-slim`).
    type: "nodejs:24"

    # pnpm installed the Upsun-native way (works with or without corepack).
    # Pinned to Paperclip's declared packageManager (pnpm@9.15.4) to avoid version drift.
    dependencies:
      nodejs:
        pnpm: "9.15.4"

    # Skip Upsun's default nodejs `npm install` flavor; we drive install with pnpm.
    build:
      flavor: none

    hooks:
      build: |
        set -eux
        pnpm install --frozen-lockfile
        pnpm run build
        # Runtime resolve hook (see start command for the full rationale). Paperclip's
        # workspace packages export TS *source* (exports -> ./src/*.ts), but running TS
        # at runtime needs tsx, and tsx's async loader deadlocks on Upsun's Node 24
        # (sync static-graph resolution blocks on the loader worker). Since the build
        # already compiles every package to dist/, this synchronous resolve hook
        # (module.registerHooks — no worker, no deadlock) redirects any resolved
        # workspace `.../src/*.ts` to its compiled `.../dist/*.js`, so the server runs
        # as plain JS under plain node. Written into the app tree so it ships at runtime.
        cat > .upsun-dist-resolve.mjs <<'HOOK'
        import { registerHooks } from "node:module";
        import { existsSync } from "node:fs";
        import { fileURLToPath } from "node:url";
        registerHooks({
          resolve(specifier, context, nextResolve) {
            const r = nextResolve(specifier, context);
            try {
              if (r?.url?.startsWith("file:") && r.url.includes("/src/") && r.url.endsWith(".ts")) {
                const distUrl = r.url.replace("/src/", "/dist/").replace(/\.ts$/, ".js");
                if (existsSync(fileURLToPath(distUrl))) return { ...r, url: distUrl, format: "module" };
              }
            } catch {}
            return r;
          },
        });
        HOOK
        # Upsun .environment file (sourced at deploy + runtime, NOT at build). Written into
        # the app root, like the resolve hook above — never committed into the pinned submodule.
        # Relationship/route vars do not exist during this build hook; they DO when .environment
        # is sourced later, so the literal ${...} refs below expand at deploy/runtime.
        # Pattern per https://developer.upsun.com/docs/add-services/postgresql#use-in-app
        cat > .environment <<'ENV'
        # DATABASE_URL from the postgresql relationship's individual service vars.
        # Scheme is hardcoded to `postgresql`, NOT ${POSTGRESQL_SCHEME} (= `pgsql` on Upsun,
        # which Paperclip's pg connection parser rejects).
        export DATABASE_URL="postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_PATH}"
        # PAPERCLIP_PUBLIC_URL derived from the PRIMARY upstream route, so it is correct on
        # every environment (main + PR/preview branches) instead of a hardcoded main-env URL.
        # Setting it supplies auth.publicBaseUrl AND derives auth.baseUrlMode=explicit, which
        # the authenticated+public exposure check requires.
        export PAPERCLIP_PUBLIC_URL="$(echo "$PLATFORM_ROUTES" | base64 -d | jq -r 'to_entries | map(select(.value.primary == true and .value.type == "upstream")) | .[0].key')"
        ENV
        # TODO(Phase 3): build + register our external adapter, write adapter-plugins.json

    # Run Paperclip's compiled server as plain JS. NOT via tsx: tsx's async
    # module.register() loader deadlocks on Upsun's Node 24 — the server's static
    # import graph is resolved synchronously and blocks on the loader worker (frozen
    # process, no port bound, defunct esbuild child; reproduced with both
    # `--import loader.mjs` and the tsx CLI). The build-generated resolve hook lets
    # plain node load the compiled dist directly (verified live: server boots into
    # app logic, no deadlock). Paths are relative to source.root (= upstream/).
    #
    # DATABASE_URL and PAPERCLIP_PUBLIC_URL are now exported from the build-generated
    # `.environment` file (sourced before this command), so the start command is just node.
    web:
      commands:
        start: "node --import ./.upsun-dist-resolve.mjs server/dist/index.js"
      locations:
        "/":
          passthru: true

    # Persistent state that must survive redeploys (instance config, uploads, run logs).
    # The secrets master key is NOT here — it comes from an env var (see variables.env).
    # NOTE: mount keys are relative to the app root, so this mount lives at
    # /app/paperclip-home at runtime (NOT the filesystem root /paperclip-home).
    # PAPERCLIP_HOME below must point at that runtime path or the app's mkdir of
    # instances/default/logs fails with ENOENT against the read-only root fs.
    mounts:
      "/paperclip-home":
        source: "storage"
        source_path: "paperclip-home"

    relationships:
      postgresql: "postgresql:postgresql"

    variables:
      env:
        SERVE_UI: "true"
        PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
        PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
        PAPERCLIP_HOME: "/app/paperclip-home"
        # Bind all interfaces so Upsun's router can reach the container (default is loopback).
        HOST: "0.0.0.0"
        # Apply Drizzle migrations on boot, non-interactively.
        PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
        PAPERCLIP_MIGRATION_PROMPT: "never"
        # PAPERCLIP_PUBLIC_URL is NOT set here — it is derived per-environment from the primary
        # upstream route in the build-generated `.environment` file (see the build hook). It feeds
        # auth.publicBaseUrl and derives auth.baseUrlMode=explicit, which authenticated+public
        # exposure requires (index.ts: "authenticated public exposure requires auth.baseUrlMode=explicit").
      # Sensitive vars set out-of-band via `upsun variable:create --sensitive --prefix env:`:
      #   PAPERCLIP_SECRETS_MASTER_KEY  (32-byte key; strict mode defaults on in authenticated mode)
      #   BETTER_AUTH_SECRET
      # NOTE: ANTHROPIC_API_KEY / OPENAI_API_KEY belong on the upsun-agent TASK, not here (PLAN §5.1).

    # TODO(Phase 3): scope the auth-proxy tokens this app may mint (mirrors playground admin app).
    # authorizations:
    #   - type: task
    #     resource: upsun-agent
    #     action: operate
    #   - type: env
    #     action: view

# TODO(Phase 2): the ephemeral task that runs one agent heartbeat. Modeled on the
